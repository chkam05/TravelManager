<section class="public-transport-panel__view" data-public-transport-panel-view="lines">
    <div class="public-transport-panel__provider">
        <label>
            <span>{{ t('PUBLIC_TRANSPORT_VIEW.CARRIER') }}</span>
            <select data-public-transport-panel-provider aria-label="{{ t('PUBLIC_TRANSPORT_VIEW.CARRIER') }}">
                {% for group in provider_groups %}
                    <optgroup label="{{ group.region }}">
                        {% for provider in group.providers %}
                            <option value="{{ provider.id }}"
                                    data-icon="{{ provider.icon }}"
                                    data-description="{{ provider.description }}"
                                    data-show-route-map="{{ 'true' if provider.show_route_map else 'false' }}"
                                    data-approximate-route-map="{{ 'true' if provider.approximate_route_map else 'false' }}"
                                    data-show-vehicle-positions="{{ 'true' if provider.show_vehicle_positions else 'false' }}">{{ provider.name }}</option>
                        {% endfor %}
                    </optgroup>
                {% endfor %}
            </select>
        </label>
        <label>
            <span>{{ t('PUBLIC_TRANSPORT_LINES.SEARCH_LINES') }}</span>
            <span class="public-transport-panel__search">
                <i data-lucide="search" aria-hidden="true"></i>
                <input type="search" data-public-transport-panel-search placeholder="{{ t('PUBLIC_TRANSPORT_LINES.ENTER_LINE_NUMBER') }}" autocomplete="off">
            </span>
        </label>
    </div>
    <div class="public-transport-panel__empty" data-public-transport-panel-empty hidden>
        <i data-lucide="database" aria-hidden="true"></i>
        <strong>{{ t('PANEL_PUBLIC_TRANSPORT.NO_DOWNLOADED_DATA') }}</strong>
        <span>{{ t('PANEL_PUBLIC_TRANSPORT.DOWNLOAD_CARRIER_DATA') }}</span>
        <button type="button" data-public-transport-panel-update>{{ t('COMMON.UPDATE') }}</button>
    </div>
    <div data-public-transport-panel-lines></div>
</section>
