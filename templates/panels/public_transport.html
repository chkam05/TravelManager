<aside class="public-transport-panel" id="public-transport-panel" aria-live="polite" aria-hidden="true">
    <div class="public-transport-panel__grabber" data-public-transport-panel-grabber aria-hidden="true"></div>
    <div class="public-transport-panel__body">
        <header class="public-transport-panel__header">
            <button class="public-transport-panel__icon-button" type="button" data-public-transport-panel-back aria-label="{{ t('COMMON.BACK') }}" hidden>
                <i data-lucide="arrow-left" aria-hidden="true"></i>
            </button>
            <h2 data-public-transport-panel-title>{{ t('PUBLIC_TRANSPORT_VIEW.TITLE') }}</h2>
            <div class="public-transport-panel__mode" role="radiogroup" aria-label="{{ t('PANEL_PUBLIC_TRANSPORT.TRANSPORT_MODE') }}">
                <button class="public-transport-panel__mode-button public-transport-panel__mode-button--active" type="button" role="radio" aria-checked="true" data-public-transport-panel-mode="city" aria-label="{{ t('MAIN_MENU.PUBLIC_TRANSPORT') }}" title="{{ t('MAIN_MENU.PUBLIC_TRANSPORT') }}">
                    <i data-lucide="bus-front" aria-hidden="true"></i>
                    <span class="sr-only">{{ t('MAIN_MENU.PUBLIC_TRANSPORT') }}</span>
                </button>
                <button class="public-transport-panel__mode-button" type="button" role="radio" aria-checked="false" data-public-transport-panel-mode="rail" aria-label="{{ t('HOME_VIEW.TRAINS') }}" title="{{ t('HOME_VIEW.TRAINS') }}">
                    <i data-lucide="train-front" aria-hidden="true"></i>
                    <span class="sr-only">{{ t('HOME_VIEW.TRAINS') }}</span>
                </button>
            </div>
            <button class="public-transport-panel__icon-button" type="button" data-public-transport-panel-map aria-label="{{ t('PUBLIC_TRANSPORT_VIEW.SHOW_ON_MAP') }}" title="{{ t('PUBLIC_TRANSPORT_VIEW.SHOW_ON_MAP') }}" hidden>
                <i data-lucide="route" aria-hidden="true"></i>
            </button>
            <button class="public-transport-panel__icon-button" type="button" data-public-transport-panel-vehicles aria-label="{{ t('PANEL_PUBLIC_TRANSPORT.SHOW_VEHICLES_ON_MAP') }}" title="{{ t('PANEL_PUBLIC_TRANSPORT.SHOW_VEHICLES_ON_MAP') }}" hidden>
                <i data-lucide="navigation" aria-hidden="true"></i>
            </button>
            <button class="public-transport-panel__icon-button" type="button" data-public-transport-panel-stop-map aria-label="{{ t('PANEL_PUBLIC_TRANSPORT.SHOW_STOP_ON_MAP') }}" title="{{ t('PANEL_PUBLIC_TRANSPORT.SHOW_STOP_ON_MAP') }}" hidden>
                <i data-lucide="map-pin" aria-hidden="true"></i>
            </button>
            <button class="public-transport-panel__close" type="button" data-public-transport-panel-close aria-label="{{ t('PANEL_PUBLIC_TRANSPORT.CLOSE_PANEL') }}"></button>
        </header>
        <div class="public-transport-panel__live-status" data-public-transport-panel-live-status hidden>
            <i data-lucide="radio" aria-hidden="true"></i>
            <span data-public-transport-panel-live-status-text></span>
        </div>
        <div class="public-transport-panel__content" data-public-transport-panel-content>
            {% include 'panels/public_transport/lines.html' %}
            {% include 'panels/public_transport/line.html' %}
            {% include 'panels/public_transport/line_stop.html' %}
            {% include 'panels/public_transport/stop_lines.html' %}
        </div>
    </div>
</aside>
