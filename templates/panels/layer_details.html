<aside class="layer-details-panel" id="layer-details-panel" aria-live="polite" aria-hidden="true">
    <div class="layer-details-panel__grabber" data-layer-details-panel-grabber aria-hidden="true"></div>
    <div class="layer-details-panel__body">
        <div class="layer-details-panel__header">
            <h2 class="layer-details-panel__title">{{ t('PANEL_LAYER_DETAILS.TITLE') }}</h2>
            <div class="layer-details-panel__header-actions">
                <button class="layer-details-panel__close" data-layer-details-panel-close type="button" aria-label="{{ t('PANEL_LAYER_DETAILS.CLOSE_PANEL') }}"></button>
            </div>
        </div>
        <div class="layer-details-panel__content">
            <section class="layer-details-panel__section">
                <h3 class="layer-details-panel__section-title">{{ t('PANEL_LAYER_DETAILS.BASE_LAYER') }}</h3>
                <label class="layer-details-panel__option">
                    <input data-base-layer="standard" name="map_base_layer" type="radio">
                    <span><strong>{{ t('RES_MAP_LAYER.STANDARD') }}</strong><small>OpenStreetMap Carto</small></span>
                </label>
                <label class="layer-details-panel__option">
                    <input data-base-layer="cyclosm" name="map_base_layer" type="radio">
                    <span><strong>CyclOSM</strong><small>{{ t('RES_MAP_LAYER.CYCLE_MAP_DESCRIPTION') }}</small></span>
                </label>
                <label class="layer-details-panel__option layer-details-panel__option--disabled">
                    <input data-base-layer="cycle_map" name="map_base_layer" type="radio" disabled>
                    <span><strong>Cycle Map</strong><small>{{ t('RES_MAP_LAYER.TILE_PROVIDER_KEY_REQUIRED') }}</small></span>
                </label>
                <label class="layer-details-panel__option layer-details-panel__option--disabled">
                    <input data-base-layer="transport_map" name="map_base_layer" type="radio" disabled>
                    <span><strong>Transport Map</strong><small>{{ t('RES_MAP_LAYER.TILE_PROVIDER_KEY_REQUIRED') }}</small></span>
                </label>
                <label class="layer-details-panel__option layer-details-panel__option--disabled">
                    <input data-base-layer="tracestrack_topo" name="map_base_layer" type="radio" disabled>
                    <span><strong>Tracestrack Topo</strong><small>{{ t('RES_MAP_LAYER.TILE_PROVIDER_CONFIGURATION_REQUIRED') }}</small></span>
                </label>
                <label class="layer-details-panel__option">
                    <input data-base-layer="humanitarian" name="map_base_layer" type="radio">
                    <span><strong>Humanitarian</strong><small>Humanitarian OpenStreetMap Team</small></span>
                </label>
                <label class="layer-details-panel__option layer-details-panel__option--disabled">
                    <input data-base-layer="shortbread" name="map_base_layer" type="radio" disabled>
                    <span><strong>Shortbread</strong><small>{{ t('RES_MAP_LAYER.VECTOR_RENDERER_REQUIRED') }}</small></span>
                </label>
                <label class="layer-details-panel__option layer-details-panel__option--disabled">
                    <input data-base-layer="maptiler_omt" name="map_base_layer" type="radio" disabled>
                    <span><strong>MapTiler OMT</strong><small>{{ t('RES_MAP_LAYER.MAPTILER_KEY_REQUIRED') }}</small></span>
                </label>
            </section>

            <section class="layer-details-panel__section">
                <h3 class="layer-details-panel__section-title">{{ t('RES_MAP_LAYER.FAVOURITE_PLACES') }}</h3>
                <label class="layer-details-panel__option">
                    <input data-layer-toggle="layer_favourites_enabled" type="checkbox">
                    <span><strong>{{ t('RES_MAP_LAYER.FAVOURITE_PLACES') }}</strong><small>{{ t('RES_MAP_LAYER.FAVOURITE_PLACES_DESCRIPTION') }}</small></span>
                </label>
                <div class="layer-details-panel__separator" aria-hidden="true"></div>
                <div class="layer-details-panel__tag-list" id="layer-details-favourite-tags" aria-live="polite"></div>
            </section>

            <section class="layer-details-panel__section">
                <h3 class="layer-details-panel__section-title">{{ t('PANEL_LAYER_DETAILS.OVERLAYS') }}</h3>
                <label class="layer-details-panel__option">
                    <input data-layer-toggle="layer_map_notes_enabled" type="checkbox">
                    <span><strong>Map Notes</strong><small>{{ t('RES_MAP_LAYER.MAP_NOTES_DESCRIPTION') }}</small></span>
                </label>
                <label class="layer-details-panel__option">
                    <input data-layer-toggle="layer_map_data_enabled" type="checkbox">
                    <span><strong>Map Data</strong><small>{{ t('RES_MAP_LAYER.MAP_DATA_DESCRIPTION') }}</small></span>
                </label>
                <label class="layer-details-panel__option">
                    <input data-layer-toggle="layer_public_gps_traces_enabled" type="checkbox">
                    <span><strong>Public GPS Trace</strong><small>{{ t('RES_MAP_LAYER.PUBLIC_GPS_TRACES_DESCRIPTION') }}</small></span>
                </label>
            </section>
            <section class="layer-details-panel__section">
                <h3 class="layer-details-panel__section-title">{{ t('LAYER_EDITOR.CUSTOM_LAYERS') }}</h3>
                <div class="layer-details-panel__tag-list" data-custom-layer-toggles></div>
            </section>
        </div>
    </div>
</aside>
