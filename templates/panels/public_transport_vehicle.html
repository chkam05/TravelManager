<aside class="public-transport-vehicle-panel" id="public-transport-vehicle-panel" aria-labelledby="public-transport-vehicle-panel-title" aria-hidden="true">
    <header class="public-transport-vehicle-panel__header">
        <div class="public-transport-vehicle-panel__icon" aria-hidden="true"><i data-lucide="bus-front"></i></div>
        <div class="public-transport-vehicle-panel__heading">
            <span>Pojazd komunikacji miejskiej</span>
            <strong id="public-transport-vehicle-panel-title" data-vehicle-panel-line></strong>
            <small data-vehicle-panel-trip hidden></small>
        </div>
        <button class="public-transport-vehicle-panel__close" data-vehicle-panel-close type="button" aria-label="Zamknij informacje o pojeździe"></button>
    </header>
    <dl class="public-transport-vehicle-panel__details">
        <div data-vehicle-panel-field="vehicle_label"><dt>Numer boczny</dt><dd></dd></div>
        <div data-vehicle-panel-field="brigade"><dt>Brygada</dt><dd></dd></div>
        <div data-vehicle-panel-field="direction"><dt>Kierunek</dt><dd></dd></div>
        <div data-vehicle-panel-field="next_stop"><dt>Następny przystanek</dt><dd></dd></div>
        <div data-vehicle-panel-field="destination"><dt>Przystanek końcowy</dt><dd></dd></div>
        <div data-vehicle-panel-field="status"><dt>Status</dt><dd></dd></div>
        <div data-vehicle-panel-field="source_code"><dt>Kod źródłowy</dt><dd></dd></div>
        <div data-vehicle-panel-field="recorded_at"><dt>Aktualizacja</dt><dd></dd></div>
    </dl>
</aside>
