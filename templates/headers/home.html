{% set current_language = language|default('en_US') %}
<div class="header__view{% if initial_view == 'home' %} header__view--active{% endif %}" data-header-view="home"{% if initial_view != 'home' %} hidden{% endif %}>
    <div class="header__view-left">
        <h1 class="header__title">{{ app_name }}</h1>
    </div>
    <div class="header__view-center"></div>
    <div class="header__view-right">
        <label class="header__language-control">
            <span class="header__language-label">{{ t('SETTINGS_APPLICATION.LANGUAGE') }}</span>
            <select class="header__language-select" data-home-language aria-label="{{ t('SETTINGS_APPLICATION.LANGUAGE') }}">
                <option value="en_US"{% if current_language == 'en_US' %} selected{% endif %}>{{ t('SETTINGS_APPLICATION.LANGUAGE_ENGLISH') }}</option>
                <option value="pl_PL"{% if current_language == 'pl_PL' %} selected{% endif %}>{{ t('SETTINGS_APPLICATION.LANGUAGE_POLISH') }}</option>
            </select>
        </label>
    </div>
</div>
