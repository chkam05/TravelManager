<div class="header__view{% if initial_view == 'map' %} header__view--active{% endif %}" data-header-view="map"{% if initial_view != 'map' %} hidden{% endif %}>
    <div class="header__view-left">
        <h1 class="header__title">{{ app_name }}</h1>
    </div>
    <div class="header__view-center">
        <form class="header__search" role="search" aria-label="{{ t('HEADER.SEARCH_PLACE') }}">
            <input class="header__search-input" type="search" name="place" placeholder="{{ t('HEADER.SEARCH_PLACE') }}" aria-label="{{ t('HEADER.SEARCH_PLACE') }}">
            <span class="header__search-actions" role="group" aria-label="{{ t('HEADER.SEARCH_OPTIONS') }}">
                <button class="header__search-button" type="submit" aria-label="{{ t('COMMON.SEARCH') }}"></button>
                <button class="header__advanced-search-button" type="button" aria-label="{{ t('HEADER.ADVANCED_SEARCH') }}" title="{{ t('HEADER.ADVANCED_SEARCH') }}">
                    <i data-lucide="chevron-down" aria-hidden="true"></i>
                </button>
            </span>
        </form>
        <button class="header__connection-search-button" data-public-transport-route-search type="button" aria-label="{{ t('MAIN_MENU.SEARCH_CONNECTIONS') }}" title="{{ t('MAIN_MENU.SEARCH_CONNECTIONS') }}">
            <i data-lucide="bus" aria-hidden="true"></i>
        </button>
    </div>
    <div class="header__view-right">
        <button class="header__car-button" type="button" hidden>
            <i data-lucide="car" aria-hidden="true"></i>
            <span class="header__car-button-text">{{ t('HEADER.CAR') }}</span>
        </button>
    </div>
</div>
