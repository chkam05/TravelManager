<div class="settings-view__group">
    <header class="settings-view__group-header">
        <h3>Uruchamianie</h3>
        <p>Ustawienia sposobu udostępniania aplikacji.</p>
    </header>

    <section class="settings-view__section" aria-labelledby="settings-view-application-startup-title" data-settings-section>
        <div class="settings-view__titlebar">
            <i class="settings-view__section-icon" data-lucide="network" aria-hidden="true"></i>
            <div class="settings-view__title-text">
                <h4 id="settings-view-application-startup-title">Udostępnianie w sieci</h4>
            </div>
            <button class="settings-view__collapse-button" type="button" aria-label="Zwiń grupę" aria-expanded="true" data-settings-collapse>
                <i data-lucide="chevron-up" aria-hidden="true"></i>
            </button>
            <div class="settings-view__description">
                <p>Po ponownym uruchomieniu aplikacja użyje adresu IPv4 aktywnej karty sieciowej. Włączaj tę opcję tylko w zaufanej sieci.</p>
            </div>
        </div>
        <div class="settings-view__section-content" data-settings-section-content>
            <dl class="settings-view__values" data-settings-group="application"></dl>
        </div>
    </section>
</div>
