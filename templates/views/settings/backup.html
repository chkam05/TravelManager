<div class="settings-view__group">
    <header class="settings-view__group-header">
        <h3>Import i eksport</h3>
        <p>Kopie wybranych danych aplikacji zapisywane i odtwarzane z plików JSON.</p>
    </header>
    <section class="settings-view__section" aria-labelledby="settings-view-data-transfer-title" data-settings-section>
        <div class="settings-view__titlebar">
            <i class="settings-view__section-icon" data-lucide="database-backup" aria-hidden="true"></i>
            <div class="settings-view__title-text"><h4 id="settings-view-data-transfer-title">Dane aplikacji</h4></div>
            <button class="settings-view__collapse-button" type="button" aria-label="Zwiń grupę" aria-expanded="true" data-settings-collapse><i data-lucide="chevron-up" aria-hidden="true"></i></button>
            <div class="settings-view__description"><p>Eksportuj lub importuj wybrane dane bez zmiany pozostałych ustawień aplikacji.</p></div>
        </div>
        <div class="settings-view__section-content" data-settings-section-content>
            <div class="settings-view__transfer">
                <button class="settings-view__action-button" id="settings-export-data" type="button" aria-haspopup="menu" aria-expanded="false"><i data-lucide="download" aria-hidden="true"></i><span>Eksportuj dane</span></button>
                <button class="settings-view__action-button" id="settings-import-data" type="button" aria-haspopup="menu" aria-expanded="false"><i data-lucide="upload" aria-hidden="true"></i><span>Importuj dane</span></button>
            </div>
        </div>
    </section>
</div>
