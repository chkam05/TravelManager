<div class="settings-view__group">
    <header class="settings-view__group-header">
        <h3>{{ t('SETTINGS_BACKUP.TITLE') }}</h3>
        <p>{{ t('SETTINGS_BACKUP.DESCRIPTION') }}</p>
    </header>
    <section class="settings-view__section" aria-labelledby="settings-view-data-transfer-title" data-settings-section>
        <div class="settings-view__titlebar">
            <i class="settings-view__section-icon" data-lucide="database-backup" aria-hidden="true"></i>
            <div class="settings-view__title-text"><h4 id="settings-view-data-transfer-title">{{ t('SETTINGS_BACKUP.APPLICATION_DATA') }}</h4></div>
            <button class="settings-view__collapse-button" type="button" aria-label="{{ t('SETTINGS_VIEW.COLLAPSE_GROUP') }}" aria-expanded="true" data-settings-collapse><i data-lucide="chevron-up" aria-hidden="true"></i></button>
            <div class="settings-view__description"><p>{{ t('SETTINGS_BACKUP.APPLICATION_DATA_DESCRIPTION') }}</p></div>
        </div>
        <div class="settings-view__section-content" data-settings-section-content>
            <div class="settings-view__transfer">
                <button class="settings-view__action-button" id="settings-export-data" type="button" aria-haspopup="menu" aria-expanded="false"><i data-lucide="download" aria-hidden="true"></i><span>{{ t('SETTINGS_BACKUP.EXPORT_DATA') }}</span></button>
                <button class="settings-view__action-button" id="settings-import-data" type="button" aria-haspopup="menu" aria-expanded="false"><i data-lucide="upload" aria-hidden="true"></i><span>{{ t('SETTINGS_BACKUP.IMPORT_DATA') }}</span></button>
            </div>
        </div>
    </section>
</div>
{% include 'views/settings/memory.html' %}
