<section class="fuel-cost-view">
    <header class="fuel-cost-view__header">
        <button class="app-view__back-button" type="button" data-app-back-to-map aria-label="{{ t('COMMON.BACK') }}">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <form class="fuel-cost-view__search" id="fuel-cost-search" role="search" aria-label="{{ t('FUEL_COST_VIEW.SEARCH_COUNTRY') }}">
            <input class="fuel-cost-view__search-input" id="fuel-cost-search-input" type="search" placeholder="{{ t('FUEL_COST_VIEW.SEARCH_COUNTRY') }}" aria-label="{{ t('FUEL_COST_VIEW.SEARCH_COUNTRY') }}">
            <button class="fuel-cost-view__search-button" type="submit">
                <i data-lucide="search" aria-hidden="true"></i>
                <span>{{ t('COMMON.SEARCH') }}</span>
            </button>
        </form>
        <div class="fuel-cost-view__spacer"></div>
        <button class="fuel-cost-view__update-button" id="fuel-cost-update" type="button">
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
            <span>{{ t('FUEL_COST_VIEW.UPDATE_DATA') }}</span>
        </button>
        <label class="fuel-cost-view__select-label">
            <span>{{ t('FUEL_COST_VIEW.CONVERSION_CURRENCY') }}</span>
            <select class="fuel-cost-view__select" id="fuel-cost-currency">
                <option value="original">{{ t('FUEL_COST_VIEW.ORIGINAL_CURRENCIES') }}</option>
            </select>
        </label>
        <label class="fuel-cost-view__select-label">
            <span>{{ t('FUEL_COST_VIEW.SORTING') }}</span>
            <select class="fuel-cost-view__select" id="fuel-cost-sort-field">
                <option value="country">{{ t('FUEL_COST_VIEW.COUNTRY_NAME') }}</option>
                <option value="petrol_95">{{ t('FUEL_COST_VIEW.PRICE_PETROL_95') }}</option>
                <option value="petrol_98">{{ t('FUEL_COST_VIEW.PRICE_PETROL_98') }}</option>
                <option value="diesel">{{ t('FUEL_COST_VIEW.PRICE_DIESEL') }}</option>
                <option value="lpg">{{ t('FUEL_COST_VIEW.PRICE_LPG') }}</option>
                <option value="manual_updated_at">{{ t('FUEL_COST_VIEW.UPDATE_DATE') }}</option>
            </select>
        </label>
        <div class="fuel-cost-view__sort">
            <button class="fuel-cost-view__sort-button" id="fuel-cost-sort-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="{{ t('FUEL_COST_VIEW.SORT') }}">
                <i data-lucide="arrow-up-down" aria-hidden="true"></i>
            </button>
            <div class="fuel-cost-view__sort-menu" id="fuel-cost-sort-menu" role="menu" aria-hidden="true">
                <button type="button" role="menuitem" data-sort-direction="asc">{{ t('FUEL_COST_VIEW.ASCENDING') }}</button>
                <button type="button" role="menuitem" data-sort-direction="desc">{{ t('FUEL_COST_VIEW.DESCENDING') }}</button>
            </div>
        </div>
    </header>
    <div class="fuel-cost-view__meta" id="fuel-cost-meta" aria-live="polite"></div>
    <div class="fuel-cost-view__table-wrap">
        <table class="fuel-cost-view__table">
            <thead>
                <tr>
                    <th>{{ t('FUEL_COST_VIEW.COUNTRY') }}</th>
                    <th>{{ t('RES_FUEL_TYPE.PETROL_95_PER_LITRE') }}</th>
                    <th>{{ t('RES_FUEL_TYPE.PETROL_98_PER_LITRE') }}</th>
                    <th>{{ t('RES_FUEL_TYPE.DIESEL_PER_LITRE') }}</th>
                    <th>{{ t('RES_FUEL_TYPE.LPG_PER_LITRE') }}</th>
                    <th>{{ t('FUEL_COST_VIEW.UPDATE_DATE') }}</th>
                    <th>{{ t('COMMON.ACTIONS') }}</th>
                </tr>
            </thead>
            <tbody id="fuel-cost-table-body"></tbody>
        </table>
    </div>
    <button class="fuel-cost-view__add" id="fuel-cost-add" type="button" aria-label="{{ t('FUEL_COST_VIEW.ADD_COUNTRY') }}">
        <i data-lucide="plus" aria-hidden="true"></i>
    </button>
</section>
