<section class="car-profiles-view">
    <header class="car-profiles-view__header">
        <button class="app-view__back-button" type="button" data-app-back-to-map aria-label="{{ t('COMMON.BACK') }}">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <form class="car-profiles-view__search" id="car-profiles-search" role="search" aria-label="{{ t('CAR_PROFILES_VIEW.SEARCH_CAR') }}">
            <input class="car-profiles-view__search-input" id="car-profiles-search-input" type="search" placeholder="{{ t('CAR_PROFILES_VIEW.SEARCH_CAR') }}" aria-label="{{ t('CAR_PROFILES_VIEW.SEARCH_CAR') }}">
            <button class="car-profiles-view__search-button" type="submit">
                <i data-lucide="search" aria-hidden="true"></i>
                <span>{{ t('COMMON.SEARCH') }}</span>
            </button>
        </form>
        <div class="car-profiles-view__spacer"></div>
        <div class="car-profiles-view__sort">
            <button class="car-profiles-view__sort-button" id="car-profiles-sort-button" type="button" aria-haspopup="menu" aria-expanded="false">
                <i data-lucide="arrow-up-down" aria-hidden="true"></i>
                <span>{{ t('CAR_PROFILES_VIEW.SORT') }}</span>
            </button>
            <div class="car-profiles-view__sort-menu" id="car-profiles-sort-menu" role="menu" aria-hidden="true">
                <button type="button" role="menuitem" data-sort-direction="asc">{{ t('CAR_PROFILES_VIEW.ASCENDING') }}</button>
                <button type="button" role="menuitem" data-sort-direction="desc">{{ t('CAR_PROFILES_VIEW.DESCENDING') }}</button>
            </div>
        </div>
    </header>
    <div class="car-profiles-view__list" id="car-profiles-list" aria-live="polite"></div>
    <button class="car-profiles-view__add" id="car-profiles-add" type="button" aria-label="{{ t('CAR_PROFILES_VIEW.ADD_CAR') }}">
        <i data-lucide="plus" aria-hidden="true"></i>
    </button>
</section>
