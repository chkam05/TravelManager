<section class="favourites-tags-view">
    <header class="favourites-tags-view__header">
        <button class="app-view__back-button" type="button" data-app-back-to-map aria-label="{{ t('COMMON.BACK') }}">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <form class="favourites-tags-view__search" id="favourites-tags-search" role="search" aria-label="{{ t('FAVOURITE_TAGS_VIEW.SEARCH_TAG') }}">
            <input class="favourites-tags-view__search-input" id="favourites-tags-search-input" type="search" placeholder="{{ t('FAVOURITE_TAGS_VIEW.SEARCH_TAG') }}" aria-label="{{ t('FAVOURITE_TAGS_VIEW.SEARCH_TAG') }}">
            <button class="favourites-tags-view__search-button" type="submit">
                <i data-lucide="search" aria-hidden="true"></i>
                <span>{{ t('COMMON.SEARCH') }}</span>
            </button>
        </form>
        <div class="favourites-tags-view__spacer"></div>
        <div class="favourites-tags-view__sort">
            <button class="favourites-tags-view__sort-button" id="favourites-tags-sort-button" type="button" aria-haspopup="menu" aria-expanded="false">
                <i data-lucide="arrow-up-down" aria-hidden="true"></i>
                <span>{{ t('FAVOURITE_TAGS_VIEW.SORT') }}</span>
            </button>
            <div class="favourites-tags-view__sort-menu" id="favourites-tags-sort-menu" role="menu" aria-hidden="true">
                <button type="button" role="menuitem" data-sort-direction="asc">{{ t('FAVOURITE_TAGS_VIEW.ASCENDING') }}</button>
                <button type="button" role="menuitem" data-sort-direction="desc">{{ t('FAVOURITE_TAGS_VIEW.DESCENDING') }}</button>
            </div>
        </div>
    </header>
    <div class="favourites-tags-view__list" id="favourites-tags-list" aria-live="polite"></div>
    <button class="favourites-tags-view__add" id="favourites-tags-add" type="button" aria-label="{{ t('FAVOURITE_TAGS_VIEW.ADD_TAG') }}">
        <i data-lucide="plus" aria-hidden="true"></i>
    </button>
</section>
