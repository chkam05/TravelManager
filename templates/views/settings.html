<div class="settings-view">
    <header class="settings-view__header">
        <h2>Ustawienia</h2>
        <p>Parametry używane podczas planowania podróży i działania aplikacji.</p>
    </header>

    <nav class="settings-view__tabs" role="tablist" aria-label="Kategorie ustawień">
        <button class="settings-view__tab settings-view__tab--active" id="settings-tab-routes" type="button" role="tab" aria-selected="true" aria-controls="settings-panel-routes" tabindex="0" data-settings-tab="routes">
            <i data-lucide="route" aria-hidden="true"></i>
            <span>Trasy</span>
        </button>
        <button class="settings-view__tab" id="settings-tab-public-transport" type="button" role="tab" aria-selected="false" aria-controls="settings-panel-public-transport" tabindex="-1" data-settings-tab="public-transport">
            <i data-lucide="bus-front" aria-hidden="true"></i>
            <span>Komunikacja miejska</span>
        </button>
        <button class="settings-view__tab" id="settings-tab-backup" type="button" role="tab" aria-selected="false" aria-controls="settings-panel-backup" tabindex="-1" data-settings-tab="backup">
            <i data-lucide="database-backup" aria-hidden="true"></i>
            <span>Kopia zapasowa</span>
        </button>
    </nav>

    <div class="settings-view__tab-panel" id="settings-panel-routes" role="tabpanel" aria-labelledby="settings-tab-routes" data-settings-tab-panel="routes">
        {% include 'views/settings/routes.html' %}
    </div>
    <div class="settings-view__tab-panel" id="settings-panel-public-transport" role="tabpanel" aria-labelledby="settings-tab-public-transport" data-settings-tab-panel="public-transport" hidden>
        {% include 'views/settings/public_transport.html' %}
    </div>
    <div class="settings-view__tab-panel" id="settings-panel-backup" role="tabpanel" aria-labelledby="settings-tab-backup" data-settings-tab-panel="backup" hidden>
        {% include 'views/settings/backup.html' %}
    </div>
</div>
