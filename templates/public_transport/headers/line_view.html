<div class="public-transport-header" data-public-transport-header="line" hidden>
    <div class="public-transport-header__left">
        <button class="public-transport-header__button" type="button" data-public-transport-back>
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            <span>Wstecz</span>
        </button>
        <span class="public-transport-line-pill" data-public-transport-header-line-pill>
            <i data-lucide="route" aria-hidden="true"></i>
            <strong data-public-transport-header-line></strong>
        </span>
    </div>
    <div class="public-transport-header__center"></div>
    <div class="public-transport-header__right">
        <label class="public-transport-header__field">
            <span>Kierunek</span>
            <select data-public-transport-direction-select></select>
        </label>
        <label class="public-transport-header__field">
            <span>Data</span>
            <select data-public-transport-date></select>
        </label>
    </div>
</div>
