<div class="public-transport-header" data-public-transport-header="stops" hidden>
    <div class="public-transport-header__left">
        <button class="public-transport-header__button" type="button" data-public-transport-carriers>
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            <span>Wstecz</span>
        </button>
    </div>
    <form class="public-transport-header__center public-transport-search" data-public-transport-search="stops">
        <input type="search" placeholder="Wyszukaj przystanek…" autocomplete="off" aria-label="Wyszukaj przystanek">
        <button type="submit" aria-label="Szukaj"><i data-lucide="search" aria-hidden="true"></i></button>
    </form>
    <div class="public-transport-header__right">
        <button class="public-transport-header__button" type="button" data-public-transport-refresh>
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
            <span>Aktualizuj</span>
        </button>
        <button class="public-transport-header__button public-transport-header__button--primary" type="button" data-public-transport-root="lines">
            <i data-lucide="route" aria-hidden="true"></i>
            <span>Linie</span>
        </button>
    </div>
</div>
