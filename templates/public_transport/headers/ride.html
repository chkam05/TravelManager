<div class="public-transport-header" data-public-transport-header="ride" hidden>
    <div class="public-transport-header__left">
        <button class="public-transport-header__button" type="button" data-public-transport-back aria-label="{{ t('COMMON.BACK') }}">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <span class="public-transport-line-pill" data-public-transport-header-line-pill>
            <i data-lucide="route" aria-hidden="true"></i>
            <strong data-public-transport-header-line></strong>
        </span>
        <div class="public-transport-header__description">
            <strong data-public-transport-header-stop></strong>
            <span data-public-transport-header-details></span>
        </div>
    </div>
    <div class="public-transport-header__center"></div>
    <div class="public-transport-header__right">
        <button class="public-transport-header__button" type="button" data-public-transport-map hidden>
            <i data-lucide="map-pin" aria-hidden="true"></i>
            <span>{{ t('PUBLIC_TRANSPORT_STOPS.SHOW_STOP') }}</span>
        </button>
        <button class="public-transport-header__button" type="button" data-public-transport-route hidden>
            <i data-lucide="map" aria-hidden="true"></i>
            <span>{{ t('PUBLIC_TRANSPORT_LINES.SHOW_ROUTE') }}</span>
        </button>
    </div>
</div>
