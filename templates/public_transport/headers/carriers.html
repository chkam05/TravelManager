<div class="public-transport-header public-transport-header--carriers" data-public-transport-header="carriers">
    <div class="public-transport-header__left">
        <button class="public-transport-header__button" type="button" data-app-back-to-map aria-label="{{ t('COMMON.BACK') }}">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <h2>{{ t('PUBLIC_TRANSPORT_CARRIERS.SELECT_CARRIER') }}</h2>
    </div>
    <form class="public-transport-header__center public-transport-search" data-public-transport-search="carriers">
        <input type="search" placeholder="{{ t('PUBLIC_TRANSPORT_CARRIERS.SEARCH_CARRIER') }}" autocomplete="off" aria-label="{{ t('PUBLIC_TRANSPORT_CARRIERS.SEARCH_CARRIER') }}">
        <button type="submit" aria-label="{{ t('COMMON.SEARCH') }}"><i data-lucide="search" aria-hidden="true"></i></button>
    </form>
    <div class="public-transport-header__right">
        <button class="public-transport-header__button" type="button" data-public-transport-refresh-all>
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
            <span>{{ t('PUBLIC_TRANSPORT_CARRIERS.UPDATE_ALL') }}</span>
        </button>
        <button class="public-transport-header__button" type="button" data-public-transport-sources>
            <i data-lucide="database" aria-hidden="true"></i>
            <span>{{ t('PUBLIC_TRANSPORT_SOURCES.DATA_SOURCES') }}</span>
        </button>
    </div>
</div>
