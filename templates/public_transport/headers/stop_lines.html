<div class="public-transport-header" data-public-transport-header="stop-lines" hidden>
    <div class="public-transport-header__left">
        <button class="public-transport-header__button" type="button" data-public-transport-back>
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            <span>Wstecz</span>
        </button>
        <div class="public-transport-header__description">
            <strong data-public-transport-header-stop></strong>
            <span data-public-transport-header-details></span>
        </div>
    </div>
    <form class="public-transport-header__center public-transport-search" data-public-transport-search="stop-lines">
        <input type="search" placeholder="Wyszukaj linię lub kierunek…" autocomplete="off" aria-label="Wyszukaj linię lub kierunek">
        <button type="submit" aria-label="Szukaj"><i data-lucide="search" aria-hidden="true"></i></button>
    </form>
    <div class="public-transport-header__right">
        <button class="public-transport-header__button" type="button" data-public-transport-map hidden>
            <i data-lucide="map-pin" aria-hidden="true"></i>
            <span>Pokaż na mapie</span>
        </button>
    </div>
</div>
