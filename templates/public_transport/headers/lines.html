<div class="public-transport-header" data-public-transport-header="lines" hidden>
    <div class="public-transport-header__left">
        <button class="public-transport-header__button" type="button" data-public-transport-carriers aria-label="Wstecz">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
    </div>
    <form class="public-transport-header__center public-transport-search" data-public-transport-search="lines">
        <input type="search" placeholder="Wyszukaj linię…" autocomplete="off" aria-label="Wyszukaj linię">
        <button type="submit" aria-label="Szukaj"><i data-lucide="search" aria-hidden="true"></i></button>
    </form>
    <div class="public-transport-header__right">
        <button class="public-transport-header__button" type="button" data-public-transport-refresh>
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
            <span>Aktualizuj</span>
        </button>
        <button class="public-transport-header__button public-transport-header__button--primary" type="button" data-public-transport-root="stops">
            <i data-lucide="map-pin" aria-hidden="true"></i>
            <span>Przystanki</span>
        </button>
    </div>
</div>
