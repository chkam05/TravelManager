<div class="public-transport-carriers">
    <header>
        <h2>{{ t('PUBLIC_TRANSPORT_VIEW.TITLE') }}</h2>
        <p>{{ t('PUBLIC_TRANSPORT_CARRIERS.SELECT_DESCRIPTION') }}</p>
    </header>
    {% for group in provider_groups %}
        <section class="public-transport-carriers__region">
            <h3 class="public-transport-carriers__region-heading">{{ group.region }}</h3>
            <div class="public-transport-carriers__grid">
                {% for provider in group.providers %}
                    <button class="public-transport-carriers__tile" type="button" data-public-transport-provider="{{ provider.id }}" data-public-transport-mode="{{ provider.mode }}" data-public-transport-update-source="{{ provider.update_source }}" data-public-transport-filter-item data-search="{{ provider.name }} {{ provider.description }}">
                        <span class="public-transport-carriers__selection" aria-hidden="true"><i data-lucide="check"></i></span>
                        <span class="public-transport-carriers__icon">
                            <i data-lucide="{{ provider.icon }}" aria-hidden="true"></i>
                        </span>
                        <span>
                            <strong>{{ provider.name }}</strong>
                            <small>{{ provider.description }}</small>
                            {% if provider.show_route_map or provider.show_vehicle_positions %}
                                <span class="public-transport-carriers__capabilities" aria-label="{{ t('PUBLIC_TRANSPORT_CARRIERS.MAP_FEATURES') }}">
                                    {% if provider.show_route_map %}
                                        <span title="{{ t('PUBLIC_TRANSPORT_CARRIERS.APPROXIMATE_ROUTE_ON_MAP') if provider.approximate_route_map else t('PUBLIC_TRANSPORT_CARRIERS.ROUTE_ON_MAP') }}"{% if provider.approximate_route_map %} class="public-transport-carriers__capability--approximate"{% endif %}>
                                            <i data-lucide="route" aria-hidden="true"></i>{% if provider.approximate_route_map %}<span aria-hidden="true">*</span>{% endif %}
                                            <span class="sr-only">{{ t('PUBLIC_TRANSPORT_CARRIERS.APPROXIMATE_ROUTE_ON_MAP_SHORT') if provider.approximate_route_map else t('PUBLIC_TRANSPORT_CARRIERS.ROUTE_ON_MAP') }}</span>
                                        </span>
                                    {% endif %}
                                    {% if provider.show_vehicle_positions %}
                                        <span title="{{ t('PUBLIC_TRANSPORT_CARRIERS.VEHICLES_ON_MAP') }}">
                                            <i data-lucide="map-pin" aria-hidden="true"></i>
                                            <span class="sr-only">{{ t('PUBLIC_TRANSPORT_CARRIERS.VEHICLES_ON_MAP') }}</span>
                                        </span>
                                    {% endif %}
                                </span>
                            {% endif %}
                        </span>
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                    </button>
                {% endfor %}
            </div>
        </section>
    {% endfor %}
</div>
