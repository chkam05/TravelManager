<form class="layer-name-editor" id="layer-name-editor" role="dialog" aria-modal="true" aria-labelledby="layer-name-editor-title" aria-hidden="true">
    <header class="layer-name-editor__header">
        <h2 id="layer-name-editor-title">{{ t('LAYER_EDITOR.RENAME') }}</h2>
        <button class="layer-name-editor__close" data-layer-name-cancel type="button" aria-label="{{ t('COMMON.CLOSE') }}"></button>
    </header>
    <div class="layer-name-editor__content">
        <label class="layer-name-editor__field">
            <span>{{ t('LAYER_EDITOR.LAYER_NAME') }}</span>
            <input id="layer-name-editor-input" type="text" maxlength="120" required autocomplete="off">
        </label>
        <input id="layer-name-editor-icon" type="hidden">
        <section class="favourites-editor__icon-picker" aria-label="{{ t('LAYERS_VIEW.ICON_SELECTION') }}">
            <div class="favourites-editor__selected">
                <span class="favourites-editor__selected-icon" id="layer-name-editor-selected-icon" aria-hidden="true">-</span>
                <div class="favourites-editor__selected-text">
                    <span>{{ t('LAYERS_VIEW.ICON') }}</span>
                    <strong id="layer-name-editor-selected-name">{{ t('FAVOURITE_EDITOR.NO_CUSTOM_ICON') }}</strong>
                </div>
            </div>
            <div class="favourites-editor__icon-actions">
                <button class="favourites-editor__small-button" id="layer-name-editor-toggle-icons" type="button">{{ t('FAVOURITE_EDITOR.CHOOSE_ICON') }}</button>
                <button class="favourites-editor__small-button" id="layer-name-editor-remove-icon" type="button" hidden>{{ t('FAVOURITE_EDITOR.REMOVE_ICON') }}</button>
            </div>
            <div class="favourites-editor__emoji-picker" id="layer-name-editor-emoji-picker" hidden>
                <div class="favourites-editor__tabs" id="layer-name-editor-tabs" role="tablist" aria-label="{{ t('FAVOURITE_EDITOR.EMOJI_CATEGORIES') }}"></div>
                <div class="favourites-editor__separator" aria-hidden="true"></div>
                <div class="favourites-editor__presets" id="layer-name-editor-presets" role="tabpanel" aria-live="polite"></div>
            </div>
        </section>
        <label class="component-checkbox component-checkbox--strong">
            <input id="layer-name-editor-show-title" type="checkbox">
            <span>{{ t('LAYERS_VIEW.SHOW_TITLE') }}</span>
        </label>
    </div>
    <footer class="layer-name-editor__footer">
        <button class="layer-name-editor__button" data-layer-name-cancel type="button">{{ t('COMMON.CANCEL') }}</button>
        <button class="layer-name-editor__button layer-name-editor__button--primary" type="submit">{{ t('COMMON.SAVE') }}</button>
    </footer>
</form>
