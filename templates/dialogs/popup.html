<div class="popup-dialog" id="popup-dialog" role="alertdialog" aria-modal="true" aria-labelledby="popup-dialog-title" aria-describedby="popup-dialog-message" aria-hidden="true">
    <header class="popup-dialog__header">
        <div class="popup-dialog__icon popup-dialog__icon--info" id="popup-dialog-icon" aria-hidden="true">
            <i data-lucide="info"></i>
        </div>
        <h2 class="popup-dialog__title" id="popup-dialog-title">Informacja</h2>
    </header>
    <div class="popup-dialog__content">
        <p class="popup-dialog__message" id="popup-dialog-message"></p>
    </div>
    <footer class="popup-dialog__footer">
        <button class="popup-dialog__button component-button component-button--primary" data-popup-close type="button">OK</button>
    </footer>
</div>
