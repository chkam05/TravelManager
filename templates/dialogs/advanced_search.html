<form class="advanced-search" id="advanced-search" role="dialog" aria-modal="true" aria-labelledby="advanced-search-title" aria-hidden="true">
    <header class="advanced-search__header">
        <h2 id="advanced-search-title">{{ t('ADVANCED_SEARCH.TITLE') }}</h2>
        <button class="advanced-search__close" data-advanced-search-cancel type="button" aria-label="{{ t('COMMON.CLOSE') }}"></button>
    </header>

    <div class="advanced-search__content">
        <div class="advanced-search__query">
            <input class="advanced-search__input" id="advanced-search-query" name="query" type="search" placeholder="{{ t('ADVANCED_SEARCH.OPTIONAL_KEYWORD') }}" autocomplete="off">
        </div>

        <section class="advanced-search__groupbox">
            <h3 class="advanced-search__group-title">{{ t('ADVANCED_SEARCH.CATEGORIES') }}</h3>
            <div class="advanced-search__buttons advanced-search__buttons--categories" id="advanced-search-categories" role="radiogroup" aria-label="{{ t('ADVANCED_SEARCH.SEARCH_CATEGORIES') }}"></div>
        </section>

        <section class="advanced-search__groupbox" id="advanced-search-subcategory-section" hidden>
            <h3 class="advanced-search__group-title">{{ t('ADVANCED_SEARCH.SUBCATEGORY') }}</h3>
            <div class="advanced-search__buttons" id="advanced-search-subcategories" role="radiogroup" aria-label="{{ t('ADVANCED_SEARCH.SEARCH_SUBCATEGORIES') }}"></div>
        </section>

        <section class="advanced-search__groupbox">
            <h3 class="advanced-search__group-title">{{ t('ADVANCED_SEARCH.AREA') }}</h3>
            <label class="advanced-search__range">
                <span>{{ t('ADVANCED_SEARCH.DISTANCE_FROM_MAP_CENTRE') }}</span>
                <strong id="advanced-search-radius-label">{{ t('ADVANCED_SEARCH.VISIBLE_AREA') }}</strong>
                <input id="advanced-search-radius" name="radius" type="range" min="0" max="50" step="1" value="0">
            </label>
        </section>
    </div>

    <footer class="advanced-search__footer">
        <button class="advanced-search__button" data-advanced-search-cancel type="button">{{ t('COMMON.CANCEL') }}</button>
        <button class="advanced-search__button advanced-search__button--primary" type="submit">{{ t('COMMON.SEARCH') }}</button>
    </footer>
</form>
