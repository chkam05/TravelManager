<form class="route-editor" id="route-editor" role="dialog" aria-modal="true" aria-labelledby="route-editor-title" aria-hidden="true">
    <header class="route-editor__header">
        <h2 id="route-editor-title">{{ t('ROUTE_EDITOR.SAVE_ROUTE') }}</h2>
        <button class="route-editor__close" data-route-editor-cancel type="button" aria-label="{{ t('COMMON.CLOSE') }}"></button>
    </header>

    <div class="route-editor__content">
        <label class="route-editor__field">
            <span>{{ t('ROUTE_EDITOR.ROUTE_NAME') }}</span>
            <input id="route-editor-name" name="name" type="text" maxlength="120" required autocomplete="off">
        </label>

        <input id="route-editor-icon" name="icon" type="hidden" value="🚗">

        <section class="route-editor__emoji-picker" aria-label="{{ t('ROUTE_EDITOR.EMOJI_SELECTION') }}">
            <div class="route-editor__selected">
                <span class="route-editor__selected-icon" id="route-editor-selected-icon" aria-hidden="true">🚗</span>
                <div class="route-editor__selected-text">
                    <span>{{ t('ROUTE_EDITOR.SELECTED_ICON') }}</span>
                    <strong id="route-editor-selected-name">{{ t('ROUTE_EDITOR.CAR') }}</strong>
                </div>
            </div>

            <fieldset class="route-editor__modifiers" id="route-editor-modifiers" hidden>
                <legend>{{ t('ROUTE_EDITOR.MODIFIERS') }}</legend>
                <label class="route-editor__modifier" id="route-editor-gender-field" hidden>
                    <span>{{ t('ROUTE_EDITOR.GENDER') }}</span>
                    <select id="route-editor-gender">
                        <option value="">{{ t('ROUTE_EDITOR.NO_CHANGE') }}</option>
                        <option value="female">{{ t('ROUTE_EDITOR.FEMALE') }}</option>
                        <option value="neutral">{{ t('ROUTE_EDITOR.PERSON') }}</option>
                        <option value="male">{{ t('ROUTE_EDITOR.MALE') }}</option>
                    </select>
                </label>
                <label class="route-editor__modifier" id="route-editor-skin-tone-field" hidden>
                    <span>{{ t('ROUTE_EDITOR.SKIN_TONE') }}</span>
                    <select id="route-editor-skin-tone">
                        <option value="">{{ t('ROUTE_EDITOR.DEFAULT') }}</option>
                        <option value="🏻">{{ t('ROUTE_EDITOR.SKIN_LIGHT') }}</option>
                        <option value="🏼">{{ t('ROUTE_EDITOR.SKIN_MEDIUM_LIGHT') }}</option>
                        <option value="🏽">{{ t('ROUTE_EDITOR.SKIN_MEDIUM') }}</option>
                        <option value="🏾">{{ t('ROUTE_EDITOR.SKIN_MEDIUM_DARK') }}</option>
                        <option value="🏿">{{ t('ROUTE_EDITOR.SKIN_DARK') }}</option>
                    </select>
                </label>
            </fieldset>

            <div class="route-editor__tabs" id="route-editor-tabs" role="tablist" aria-label="{{ t('ROUTE_EDITOR.EMOJI_CATEGORIES') }}"></div>
            <div class="route-editor__separator" aria-hidden="true"></div>
            <div class="route-editor__presets" id="route-editor-presets" role="tabpanel" aria-live="polite"></div>
        </section>
    </div>

    <footer class="route-editor__footer">
        <button class="route-editor__button route-editor__button--danger" id="route-editor-delete" type="button" hidden>{{ t('ROUTE_EDITOR.DELETE_ROUTE') }}</button>
        <div class="route-editor__footer-spacer"></div>
        <button class="route-editor__button" data-route-editor-cancel type="button">{{ t('COMMON.CANCEL') }}</button>
        <button class="route-editor__button route-editor__button--primary" type="submit">{{ t('COMMON.SAVE') }}</button>
    </footer>
</form>
