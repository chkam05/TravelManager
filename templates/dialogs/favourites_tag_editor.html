<form class="favourites-tag-editor" id="favourites-tag-editor" role="dialog" aria-modal="true" aria-labelledby="favourites-tag-editor-title" aria-hidden="true">
    <header class="favourites-tag-editor__header">
        <h2 id="favourites-tag-editor-title">{{ t('FAVOURITE_TAG_EDITOR.ADD_TITLE') }}</h2>
        <button class="favourites-tag-editor__close" data-favourites-tag-editor-cancel type="button" aria-label="{{ t('COMMON.CLOSE') }}"></button>
    </header>

    <div class="favourites-tag-editor__content">
        <label class="favourites-tag-editor__field">
            <span>{{ t('FAVOURITE_TAG_EDITOR.TAG_NAME') }}</span>
            <input id="favourites-tag-editor-name" name="name" type="text" maxlength="80" required autocomplete="off">
        </label>

        <input id="favourites-tag-editor-icon" name="icon" type="hidden" value="⭐">

        <section class="favourites-tag-editor__emoji-picker" aria-label="{{ t('FAVOURITE_TAG_EDITOR.EMOJI_SELECTION') }}">
            <div class="favourites-tag-editor__selected">
                <span class="favourites-tag-editor__selected-icon" id="favourites-tag-editor-selected-icon" aria-hidden="true">⭐</span>
                <div class="favourites-tag-editor__selected-text">
                    <span>{{ t('FAVOURITE_TAG_EDITOR.SELECTED_ICON') }}</span>
                    <strong id="favourites-tag-editor-selected-name">{{ t('COMMON.DEFAULT') }}</strong>
                </div>
            </div>

            <fieldset class="favourites-tag-editor__modifiers" id="favourites-tag-editor-modifiers" hidden>
                <legend>{{ t('FAVOURITE_TAG_EDITOR.MODIFIERS') }}</legend>
                <label class="favourites-tag-editor__modifier" id="favourites-tag-editor-gender-field" hidden>
                    <span>{{ t('EMOJI_PICKER.GENDER') }}</span>
                    <select id="favourites-tag-editor-gender">
                        <option value="">{{ t('EMOJI_PICKER.NO_CHANGES') }}</option>
                        <option value="female">{{ t('EMOJI_PICKER.WOMAN') }}</option>
                        <option value="neutral">{{ t('EMOJI_PICKER.PERSON') }}</option>
                        <option value="male">{{ t('EMOJI_PICKER.MAN') }}</option>
                    </select>
                </label>
                <label class="favourites-tag-editor__modifier" id="favourites-tag-editor-skin-tone-field" hidden>
                    <span>{{ t('EMOJI_PICKER.SKIN_TONE') }}</span>
                    <select id="favourites-tag-editor-skin-tone">
                        <option value="">{{ t('EMOJI_PICKER.DEFAULT_TONE') }}</option>
                        <option value="🏻">{{ t('EMOJI_PICKER.LIGHT_TONE') }}</option>
                        <option value="🏼">{{ t('EMOJI_PICKER.MEDIUM_LIGHT_TONE') }}</option>
                        <option value="🏽">{{ t('EMOJI_PICKER.MEDIUM_TONE') }}</option>
                        <option value="🏾">{{ t('EMOJI_PICKER.MEDIUM_DARK_TONE') }}</option>
                        <option value="🏿">{{ t('EMOJI_PICKER.DARK_TONE') }}</option>
                    </select>
                </label>
            </fieldset>

            <label class="favourites-tag-editor__field favourites-tag-editor__search">
                <span>{{ t('EMOJI_PICKER.SEARCH') }}</span>
                <input id="favourites-tag-editor-emoji-search" type="search" autocomplete="off" placeholder="{{ t('EMOJI_PICKER.SEARCH') }}">
            </label>

            <div class="favourites-tag-editor__tabs" id="favourites-tag-editor-tabs" role="tablist" aria-label="{{ t('FAVOURITE_TAG_EDITOR.EMOJI_CATEGORIES') }}"></div>
            <div class="favourites-tag-editor__separator" aria-hidden="true"></div>
            <div class="favourites-tag-editor__presets" id="favourites-tag-editor-presets" role="tabpanel" aria-live="polite"></div>
        </section>
    </div>

    <footer class="favourites-tag-editor__footer">
        <button class="favourites-tag-editor__button" data-favourites-tag-editor-cancel type="button">{{ t('COMMON.CANCEL') }}</button>
        <button class="favourites-tag-editor__button favourites-tag-editor__button--primary" type="submit">{{ t('COMMON.SAVE') }}</button>
    </footer>
</form>
