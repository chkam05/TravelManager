<form class="fuel-update" id="fuel-update" role="dialog" aria-modal="true" aria-labelledby="fuel-update-title" aria-hidden="true">
    <header class="fuel-update__header">
        <h2 id="fuel-update-title">{{ t('FUEL_UPDATE_DIALOG.TITLE') }}</h2>
        <button class="fuel-update__close" data-fuel-update-cancel type="button" aria-label="{{ t('COMMON.CLOSE') }}"></button>
    </header>

    <div class="fuel-update__content">
        <p class="fuel-update__description">
            {{ t('FUEL_UPDATE_DIALOG.DESCRIPTION') }}
        </p>
        <div class="fuel-update__list" id="fuel-update-list" aria-live="polite"></div>
    </div>

    <footer class="fuel-update__footer">
        <button class="fuel-update__button" data-fuel-update-cancel type="button">{{ t('COMMON.CANCEL') }}</button>
        <button class="fuel-update__button fuel-update__button--primary" type="submit">{{ t('COMMON.UPDATE') }}</button>
    </footer>
</form>
